
<div class="form-group field-flex-start" [formGroup]="form">
  <div class="col-4 px-0">
    <input type="text" class="form-control"  formControlName="id" >
  </div>
  <div class="col-6 px-0">
    <input type="text" class="form-control"  formControlName="rule" >
  </div>
  <button type="button" class="btn btn-icon tpi-primary ms-1 flex-shrink-0" (click)="delete($event)">
    <i class="fa fa-minus"></i>
  </button>
</div>
